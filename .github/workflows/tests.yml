name: Unity Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'com.zerogamestudio.zeroengine*/**'
      - 'com.zerogamestudio.analytics/**'
      - 'Tools/Tests/**'
      - 'Tools/unity-mcp-supervisor/**'
      - '.github/workflows/tests.yml'
      - '.github/workflows/unity-mcp-supervisor.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docs/specs/**'
      - 'com.zerogamestudio.zeroengine*/**'
      - 'com.zerogamestudio.analytics/**'
      - 'Tools/Tests/**'
      - 'Tools/unity-mcp-supervisor/**'
      - '.github/workflows/tests.yml'
      - '.github/workflows/unity-mcp-supervisor.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Run Unity Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: legacy
            name: Legacy package
          - lane: modular
            name: Modular packages
          - lane: dashboard-only
            name: Dashboard only
          - lane: dashboard-with-modules
            name: Dashboard with Analytics and UI
          - lane: modules-only
            name: Modules without Dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup isolated Unity project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestProject/Assets TestProject/Packages TestProject/ProjectSettings
          shopt -s nullglob

          include_package() {
            local package_name="$1"
            case "${{ matrix.lane }}" in
              legacy)
                [[ "$package_name" == "com.zerogamestudio.analytics" ||
                   ( "$package_name" == com.zerogamestudio.zeroengine* &&
                     "$package_name" != "com.zerogamestudio.zeroengine.modsystem" ) ]]
                ;;
              modular)
                [[ "$package_name" == "com.zerogamestudio.analytics" || ( "$package_name" == com.zerogamestudio.zeroengine.* ) ]]
                ;;
              dashboard-only)
                [[ "$package_name" == "com.zerogamestudio.zeroengine.dashboard" ||
                   "$package_name" == "com.zerogamestudio.zeroengine.editor-ui" ]]
                ;;
              dashboard-with-modules)
                [[ "$package_name" == "com.zerogamestudio.zeroengine.dashboard" ||
                   "$package_name" == "com.zerogamestudio.zeroengine.editor-ui" ||
                   "$package_name" == "com.zerogamestudio.zeroengine.core" ||
                   "$package_name" == "com.zerogamestudio.zeroengine.ui" ||
                   "$package_name" == "com.zerogamestudio.analytics" ]]
                ;;
              modules-only)
                [[ "$package_name" == "com.zerogamestudio.analytics" ||
                   ( "$package_name" == com.zerogamestudio.zeroengine.* && "$package_name" != "com.zerogamestudio.zeroengine.dashboard" ) ]]
                ;;
              *)
                return 1
                ;;
            esac
          }

          for package_path in com.zerogamestudio.zeroengine* com.zerogamestudio.analytics; do
            [[ -d "$package_path" ]] || continue
            package_name=$(basename "$package_path")
            if include_package "$package_name"; then
              cp -r "$package_path" "TestProject/Packages/"
            fi
          done

          deps='"com.unity.test-framework": "1.3.9"'
          deps="$deps, \"com.unity.modules.physics\": \"1.0.0\""
          deps="$deps, \"com.unity.modules.physics2d\": \"1.0.0\""
          deps="$deps, \"com.unity.modules.ai\": \"1.0.0\""
          deps="$deps, \"com.unity.modules.animation\": \"1.0.0\""
          deps="$deps, \"com.unity.modules.audio\": \"1.0.0\""
          deps="$deps, \"com.unity.modules.imgui\": \"1.0.0\""
          deps="$deps, \"com.unity.modules.ui\": \"1.0.0\""
          deps="$deps, \"com.unity.modules.imageconversion\": \"1.0.0\""
          deps="$deps, \"com.unity.modules.unitywebrequest\": \"1.0.0\""
          deps="$deps, \"com.unity.modules.particlesystem\": \"1.0.0\""
          deps="$deps, \"com.unity.modules.tilemap\": \"1.0.0\""

          testables=''
          for package_path in TestProject/Packages/com.zerogamestudio.*; do
            [[ -d "$package_path" ]] || continue
            package_name=$(basename "$package_path")
            if [[ "${{ matrix.lane }}" == "legacy" &&
                  "$package_name" != "com.zerogamestudio.zeroengine" &&
                  "$package_name" != "com.zerogamestudio.zeroengine.dashboard" ]]; then
              continue
            fi
            deps="$deps, \"$package_name\": \"file:$package_name\""
            if [[ -n "$testables" ]]; then
              testables="$testables, "
            fi
            testables="$testables\"$package_name\""
          done

          if [[ "${{ matrix.lane }}" == "dashboard-with-modules" ]]; then
            deps="$deps, \"com.zerogamestudio.dashboard-removal-fixture\": \"file:../../Tools/Tests/Fixtures/com.zerogamestudio.dashboard-removal-fixture\""
          fi

          cat > TestProject/Packages/manifest.json << EOF
          {
            "dependencies": {
              $deps
            },
            "testables": [
              $testables
            ]
          }
          EOF

          cat > TestProject/ProjectSettings/ProjectVersion.txt << 'EOF'
          m_EditorVersion: 2022.3.62f1
          EOF

      - name: Validate descriptors and package shape
        shell: pwsh
        run: >-
          ./Tools/Tests/Test-ZeroEngineDashboardDescriptors.ps1
          -RootPath $PWD
          -ProjectManifest TestProject/Packages/manifest.json

      - name: Cache lane-specific Unity Library
        uses: actions/cache@v4
        with:
          path: TestProject/Library
          key: Library-${{ matrix.lane }}-${{ github.run_id }}-${{ hashFiles('com.zerogamestudio*/package.json') }}
          restore-keys: |
            Library-${{ matrix.lane }}-

      - name: Enforce cold Library
        shell: bash
        run: rm -rf TestProject/Library

      - name: Run EditMode Tests
        uses: game-ci/unity-test-runner@v4
        id: testRunner
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ZEROENGINE_DASHBOARD_PACKAGE_REMOVAL_TEST: ${{ matrix.lane == 'dashboard-with-modules' && '1' || '0' }}
        with:
          unityVersion: 2022.3.62f1
          projectPath: TestProject
          testMode: EditMode
          artifactsPath: TestResults
          checkName: EditMode Test Results (${{ matrix.name }})

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test Results - ${{ matrix.lane }}
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: TestResults/*.xml
          check_name: Unity Test Report (${{ matrix.name }})
