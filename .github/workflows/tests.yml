name: Unity Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'com.zerogamestudio.zeroengine*/**'
      - 'com.zerogamestudio.analytics/**'
      - 'Tools/Tests/**'
      - 'Tools/Packages/**'
      - 'Services/leaderboards/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docs/specs/**'
      - 'com.zerogamestudio.zeroengine*/**'
      - 'com.zerogamestudio.analytics/**'
      - 'Tools/Tests/**'
      - 'Tools/Packages/**'
      - 'Services/leaderboards/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  package-quality:
    name: Package boundaries and project selection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package audit and project generator
        run: python3 -B -m unittest discover -s Tools/Packages -p 'test_*.py'
      - name: Audit all source packages
        run: python3 -B Tools/Packages/audit_packages.py --root . --output package-audit.json --check
      - name: Verify project Skill synchronization
        run: python3 -B -m unittest discover -s com.zerogamestudio.zeroengine.ai-support/Tools~ -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Package Audit
          path: package-audit.json
          retention-days: 14

  test:
    name: Run Unity Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: legacy
            name: Legacy package
            test-mode: EditMode
          - lane: modular
            name: Modular packages
            test-mode: EditMode
          - lane: dashboard-only
            name: Dashboard only
            test-mode: EditMode
          - lane: dashboard-with-modules
            name: Dashboard with Analytics and UI
            test-mode: EditMode
          - lane: modules-only
            name: Modules without Dashboard
            test-mode: EditMode
          - lane: lifecycle
            name: Core, Audio and Render lifecycles
            test-mode: PlayMode
          - lane: console-core
            name: Console core only
            test-mode: all
          - lane: console-native
            name: Console native frontend only
            test-mode: all
          - lane: console-quantum
            name: Console optional adapter without vendor SDK
            test-mode: all
          - lane: interaction
            name: Interaction core, Unity lifecycle and standalone playground
            test-mode: all

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup isolated Unity project
        shell: bash
        run: >-
          python3 Tools/Packages/create_test_project.py
          --destination TestProject
          --lane "${{ matrix.lane }}"
          --unity-version 2022.3.62f1

      - name: Validate descriptors and package shape
        shell: pwsh
        run: >-
          ./Tools/Tests/Test-ZeroEngineDashboardDescriptors.ps1
          -RootPath $PWD
          -ProjectManifest TestProject/Packages/manifest.json

      - name: Cache lane-specific Unity Library
        uses: actions/cache@v4
        with:
          path: TestProject/Library
          key: Library-${{ matrix.lane }}-${{ github.run_id }}-${{ hashFiles('com.zerogamestudio*/package.json') }}
          restore-keys: |
            Library-${{ matrix.lane }}-

      - name: Enforce cold Library
        shell: bash
        run: rm -rf TestProject/Library

      - name: Run ${{ matrix.test-mode }} Tests
        uses: game-ci/unity-test-runner@v4
        id: testRunner
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ZEROENGINE_DASHBOARD_PACKAGE_REMOVAL_TEST: ${{ matrix.lane == 'dashboard-with-modules' && '1' || '0' }}
        with:
          unityVersion: 2022.3.62f1
          cliVersion: v0.1.72
          projectPath: TestProject
          testMode: ${{ matrix.test-mode }}
          artifactsPath: TestResults
          checkName: ${{ matrix.test-mode }} Test Results (${{ matrix.name }})

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test Results - ${{ matrix.lane }}
          path: |
            TestResults
            TestProject/package-selection.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: TestResults/*.xml
          check_name: Unity Test Report (${{ matrix.name }})
