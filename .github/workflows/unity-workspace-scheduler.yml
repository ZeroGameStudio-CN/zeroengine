name: Unity Workspace Scheduler

on:
  push:
    branches: [main, develop]
    paths:
      - "Tools/unity-workspace-scheduler/**"
      - ".github/workflows/unity-workspace-scheduler.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "Tools/unity-workspace-scheduler/**"
      - ".github/workflows/unity-workspace-scheduler.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Tools/unity-workspace-scheduler
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          working-directory: Tools/unity-workspace-scheduler
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q
      - run: uv build
