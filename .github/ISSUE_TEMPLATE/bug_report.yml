name: Bug report
description: Report a reproducible ZeroEngine package bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: package
    attributes:
      label: Package
      description: Package name, for example com.zerogamestudio.zeroengine.pathfinding2d.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Package version or Git commit hash.
    validations:
      required: true
  - type: input
    id: unity
    attributes:
      label: Unity version
      placeholder: 2022.3.62f1
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Provide the smallest steps that reproduce the issue.
      placeholder: |
        1. Create/open a Unity project
        2. Install ...
        3. Run ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste Unity console errors, stack traces, or screenshots if useful.
    validations:
      required: false
