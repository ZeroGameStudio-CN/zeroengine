[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroengine-leaderboards-server"
version = "0.1.0"
description = "Server-only authenticated run receipts and durable score delivery"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ze_leaderboards*"]
