[project]
name = "unity-mcp-supervisor"
version = "0.5.0"
description = "Project-safe supervisor and CLI for Unity MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.1,<9",
  "fastmcp==3.0.2",
  "filelock>=3.16,<4",
  "httpx>=0.27,<1",
  "mcp==1.25.0",
  "mcpforunityserver==10.1.2",
  "psutil>=6,<8",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
umcp = "unity_mcp_supervisor.cli:main"
umcpd = "unity_mcp_supervisor.cli:daemon_entry"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff==0.16.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unity_mcp_supervisor = ["unity_package/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
