limit_req_zone $binary_remote_addr zone=ze_upm_preview_read:1m rate=10r/s;
server {
    listen 80;
    server_name packages-preview.zerogamestudio.com;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name packages-preview.zerogamestudio.com;
    ssl_certificate /etc/letsencrypt/live/packages-preview.zerogamestudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/packages-preview.zerogamestudio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location ~ ^/(com\.zerogamestudio\.zeroengine\.console(/.*)?|-/ping|-/v1/search|-/all)$ {
        limit_req zone=ze_upm_preview_read burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:19196;
        proxy_http_version 1.1;
        proxy_set_header Host packages-preview.zerogamestudio.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_redirect off;
    }
    location / { return 404; }
}
